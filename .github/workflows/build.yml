name: Build

# Вручную (Actions → Build → Run workflow, когда файл в основной ветке) и при push в рабочую ветку.
on:
  workflow_dispatch:
  push:
    branches: [claude/intelligent-thompson-yin1sd]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Linux: системные библиотеки Qt"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: cleanix-${{ runner.os }}
          path: dist/*
