name: Build

# Сборка и релиз:
#  - вручную: Actions → Build → Run workflow (поле release_tag, например v0.1.0, создаёт релиз;
#    пустое поле — только сборка и артефакты);
#  - при пуше тега v*.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create (e.g. v0.1.0). Leave empty to only build."
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Linux: системные библиотеки Qt"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Stamp version from release tag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: python
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          import os, re, pathlib
          ver = os.environ["TAG"].lstrip("v")
          for f, pat in (("cleanix/__init__.py", r'__version__ = "[^"]*"'), ("pyproject.toml", r'(?m)^version = "[^"]*"')):
              p = pathlib.Path(f)
              new = '__version__ = "%s"' % ver if f.endswith(".py") else 'version = "%s"' % ver
              p.write_text(re.sub(pat, new, p.read_text(encoding="utf-8"), count=1), encoding="utf-8")
          print("version", ver)
      - name: Build
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: cleanix-${{ runner.os }}
          path: dist/*
          retention-days: 7

  release:
    # Публикует релиз с бинарниками при пуше тега v* (например, v0.1.0)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          cd artifacts
          (cd cleanix-Windows && zip -q ../Cleanix-${TAG}-windows-x64.zip Cleanix.exe)
          (cd cleanix-Linux && chmod +x cleanix && tar czf ../cleanix-${TAG}-linux-x64.tar.gz cleanix)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Cleanix ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
          generate_release_notes: false
          body: |
            Cleanix ${{ env.TAG }}: system cleaner for Windows 10/11 and Linux.

            - **Windows:** download `Cleanix-${{ env.TAG }}-windows-x64.zip`, unzip and run `Cleanix.exe` (portable, settings are kept in the `data` folder next to it). The exe is not code-signed, so SmartScreen may warn about an unknown publisher.
            - **Linux:** download `cleanix-${{ env.TAG }}-linux-x64.tar.gz`, extract and run `./cleanix`.
