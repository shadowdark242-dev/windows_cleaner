name: Build

# Вручную (Actions → Build → Run workflow, когда файл в основной ветке) и при push в рабочую ветку.
on:
  workflow_dispatch:
  push:
    branches: [claude/intelligent-thompson-yin1sd]
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Linux: системные библиотеки Qt"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: cleanix-${{ runner.os }}
          path: dist/*

  release:
    # Публикует релиз с бинарниками при пуше тега v* (например, v0.1.0)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          cd artifacts
          (cd cleanix-Windows && zip -q ../Cleanix-${GITHUB_REF_NAME}-windows-x64.zip Cleanix.exe)
          (cd cleanix-Linux && chmod +x cleanix && tar czf ../cleanix-${GITHUB_REF_NAME}-linux-x64.tar.gz cleanix)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
          generate_release_notes: false
          body: |
            Cleanix ${{ github.ref_name }}: system cleaner for Windows 10/11 and Linux.

            - **Windows:** download `Cleanix-${{ github.ref_name }}-windows-x64.zip`, unzip and run `Cleanix.exe` (portable, settings are kept in the `data` folder next to it). The exe is not code-signed, so SmartScreen may warn about an unknown publisher.
            - **Linux:** download `cleanix-${{ github.ref_name }}-linux-x64.tar.gz`, extract and run `./cleanix`.
