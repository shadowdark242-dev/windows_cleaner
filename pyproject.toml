[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanix"
version = "0.1.5"
description = "Cross-platform system cleaner for Windows and Linux (junk files, privacy traces, registry/system issues, startup manager, duplicate finder)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["PySide6-Essentials>=6.6"]

[project.scripts]
cleanix = "cleanix.__main__:main"

[tool.setuptools.packages.find]
include = ["cleanix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
